name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependency
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Validate Bash and run mock tests
        run: make test
